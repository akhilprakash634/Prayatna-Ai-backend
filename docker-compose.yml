services:
  backend:
    build: .
    container_name: prayatna-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/prayatna.db}
      - CHROMA_PATH=${CHROMA_PATH:-./data/chroma}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_TTL_MINUTES=${JWT_TTL_MINUTES:-720}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@prayatna-saas.local}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Platform Super Admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - PRAYATNA_ADMIN_EMAIL=${PRAYATNA_ADMIN_EMAIL:-admin@prayatna.co.in}
      - PRAYATNA_ADMIN_NAME=${PRAYATNA_ADMIN_NAME:-Prayatna Admin}
      - PRAYATNA_ADMIN_PASSWORD=${PRAYATNA_ADMIN_PASSWORD:-}
      - PUBLIC_CHAT_RATE_LIMIT=${PUBLIC_CHAT_RATE_LIMIT:-30}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      # Persist SQLite database and ChromaDB vectors outside container
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
