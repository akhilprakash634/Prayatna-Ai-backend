name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            # Navigate to the repository directory
            cd /home/ubuntu/Prayatna-Ai-backend

            # Pull latest changes from main branch
            git pull origin main

            # Stop running container and reclaim disk space before rebuilding (host ./data bind mount is preserved)
            docker compose down --remove-orphans || true
            docker container prune -f || true
            docker image prune -af || true
            DISK_USED=$(df -P / | awk 'NR==2 {gsub("%",""); print $5}')
            echo "Root disk usage before build: ${DISK_USED}%"
            if [ "${DISK_USED:-0}" -ge 70 ]; then
              echo "Disk usage >= 70%, pruning Docker build cache..."
              docker builder prune -af || true
            else
              docker builder prune -f || true
            fi

            # Rebuild and start container in detached mode
            docker compose up -d --build

            # Wait for backend container to become healthy (up to 60s)
            echo "Waiting for Prayatna AI backend to start..."
            TIMEOUT=60
            ELAPSED=0
            until curl -s -f http://localhost:8000/health > /dev/null; do
              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "Health check timed out after ${TIMEOUT}s! Showing logs:"
                docker compose logs --tail=100
                exit 1
              fi
              echo "Waiting for service to be ready... (${ELAPSED}s/${TIMEOUT}s)"
              sleep 3
              ELAPSED=$((ELAPSED + 3))
            done

            echo "Backend is healthy and running!"
            curl -s http://localhost:8000/health
